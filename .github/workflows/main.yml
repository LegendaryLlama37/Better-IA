name: Build and Release Better-IA

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever you push a version tag like v1.0.0

permissions:
  contents: write # Crucial permission allowing the runner to upload artifacts to GitHub Releases

jobs:
  build-and-release:
    name: Build for Linux and Windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: better_ia_linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: better_ia_windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Linux requires specific graphics libraries installed on the headless runner to compile egui/eframe
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libxrandr-dev libdbus-1-dev

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Speeds up future workflow builds drastically by caching compiled dependencies
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Standalone Release Binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      # Locates the binary and renames it cleanly for distribution using shell agnostic operations
      - name: Prepare Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\${{ matrix.target }}\release\Better-IA.exe ${{ matrix.artifact_name }}
        shell: cmd

      - name: Prepare Artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp target/${{ matrix.target }}/release/Better-IA ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Generate and Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

