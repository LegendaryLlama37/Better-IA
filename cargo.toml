[package]
name = "better_ia"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures-util = "0.3"
urlencoding = "2.1"
rfd = "0.14"
