[package]
name = "better_ia"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28" # Provides the GUI framework and windowing

reqwest = { version = "0.12", features = ["json", "rustls-tls", "webpki-roots"] }

serde = { version = "1.0", features = ["derive"] } # For parsing IA JSON responses
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] } # Async runtime

