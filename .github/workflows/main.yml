name: Build and Release Better-IA

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever you push a version tag like v1.0.0

permissions:
  contents: write # Allows the runners to attach binary outputs directly to your release tag

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libxrandr-dev libdbus-1-dev

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # ABSOLUTE FIX: Stripped caching steps to clear bad registry locks entirely

      - name: Compile Standalone Release Binary
        run: cargo build --release

      - name: Prepare Artifact
        run: |
          cp target/release/better_ia better_ia_linux
          chmod +x better_ia_linux

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: better_ia_linux
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ABSOLUTE FIX: Isolated clean fetch forces a fresh checkout download of tokio-util, futures-util, and rfd

      - name: Compile Standalone Release Binary
        run: cargo build --release

      - name: Prepare Artifact
        run: |
          copy target\release\better_ia.exe better_ia_windows.exe
        shell: cmd

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: better_ia_windows.exe
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
